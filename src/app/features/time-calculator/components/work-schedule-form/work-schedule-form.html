<section class="ui-card h-full" aria-labelledby="schedule-form-title">
  <header class="mb-5 space-y-1">
    <h2 id="schedule-form-title" class="ui-section-title">
      {{ t().form.title }}
    </h2>
    <p class="ui-section-subtitle">{{ t().form.hint }}</p>
  </header>

  <form class="grid grid-cols-1 gap-4 sm:grid-cols-2" [formGroup]="form" novalidate>
    @for (field of fields; track field.name) {
      <div class="flex flex-col gap-1.5">
        <label class="ui-label inline-flex items-center gap-1.5" [attr.for]="'field-' + field.name">
          <span class="text-fg-muted" aria-hidden="true">
            @switch (field.name) {
              @case ('start') {
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path
                    fill-rule="evenodd"
                    d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm.75-11.25a.75.75 0 0 0-1.5 0v3.69l-1.72 1.72a.75.75 0 1 0 1.06 1.06l2.25-2.25a.75.75 0 0 0 .22-.53V6.75Z"
                    clip-rule="evenodd"
                  />
                </svg>
              }
              @case ('lunchOut') {
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path
                    d="M4.5 3.75a.75.75 0 0 0-1.5 0v5.5A3.75 3.75 0 0 0 6.75 13h.5v4.25a.75.75 0 0 0 1.5 0V13h.5a3.75 3.75 0 0 0 3.75-3.75v-5.5a.75.75 0 0 0-1.5 0v5.5a2.25 2.25 0 0 1-2.25 2.25h-.5V3.75a.75.75 0 0 0-1.5 0V14.5h-.5A2.25 2.25 0 0 1 4.5 12.25v-8.5Zm9.25-.5a.75.75 0 0 1 .75.75v12.25a.75.75 0 0 1-1.5 0V8.56l-.47.47a.75.75 0 1 1-1.06-1.06l1.75-1.75a.75.75 0 0 1 1.28.53Z"
                  />
                </svg>
              }
              @case ('lunchIn') {
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path
                    fill-rule="evenodd"
                    d="M10 2a.75.75 0 0 1 .75.75V5h2.5a.75.75 0 0 1 0 1.5h-2.5v2.5a.75.75 0 0 1-1.5 0V6.5h-2.5a.75.75 0 0 1 0-1.5h2.5V2.75A.75.75 0 0 1 10 2Zm-5.5 8.25A4.75 4.75 0 0 1 9.25 5.5a.75.75 0 0 1 1.5 0A6.25 6.25 0 1 0 4.5 11.75a.75.75 0 0 1 0-1.5Z"
                    clip-rule="evenodd"
                  />
                </svg>
              }
              @default {
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path
                    fill-rule="evenodd"
                    d="M3 6.75A2.75 2.75 0 0 1 5.75 4h8.5A2.75 2.75 0 0 1 17 6.75v6.5A2.75 2.75 0 0 1 14.25 16h-8.5A2.75 2.75 0 0 1 3 13.25v-6.5ZM5.75 5.5c-.69 0-1.25.56-1.25 1.25v.5h11v-.5c0-.69-.56-1.25-1.25-1.25h-8.5Zm9.75 3.25h-11v4.5c0 .69.56 1.25 1.25 1.25h8.5c.69 0 1.25-.56 1.25-1.25v-4.5Z"
                    clip-rule="evenodd"
                  />
                </svg>
              }
            }
          </span>
          {{ fieldLabel(field.labelKey) }}
        </label>
        <input
          type="time"
          class="ui-input"
          [class.ui-input-error]="hasOrderError()"
          [id]="'field-' + field.name"
          [formControlName]="field.name"
          [attr.aria-invalid]="hasOrderError()"
          [attr.aria-describedby]="hasOrderError() ? 'schedule-errors' : null"
        />
      </div>
    }
  </form>

  @if (form.errors && form.dirty) {
    <ul id="schedule-errors" class="mt-4 space-y-1.5" role="alert">
      @for (errorKey of orderErrors(); track errorKey) {
        <li class="text-sm text-danger-fg">{{ errorMessage(errorKey) }}</li>
      }
    </ul>
  }
</section>
