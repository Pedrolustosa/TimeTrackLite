<div class="min-h-dvh bg-canvas">
  <div class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 sm:py-8 lg:px-8 lg:py-10">
    <header
      class="mb-6 flex flex-col gap-4 border-b border-border pb-6 sm:mb-8 sm:flex-row sm:items-start sm:justify-between sm:gap-6"
    >
      <div class="min-w-0 space-y-2">
        <div class="inline-flex items-center gap-3">
          <img
            src="android-icon-192x192.png"
            alt="Logo do TimeTrack Lite"
            class="h-10 w-10 rounded-lg object-contain"
            width="40"
            height="40"
          />
          <h1 class="text-2xl font-bold tracking-tight text-fg sm:text-3xl">
            {{ t().app.title }}
          </h1>
        </div>
        <p class="max-w-2xl text-sm text-fg-muted sm:text-base">
          {{ t().app.subtitle }}
        </p>
      </div>

      <div class="flex shrink-0 flex-wrap items-center gap-2 sm:gap-3">
        <app-language-selector />
        <app-theme-toggle />
      </div>
    </header>

    <main class="grid grid-cols-1 gap-5 lg:grid-cols-12 lg:gap-6">
      <section class="lg:col-span-5" [attr.aria-label]="t().form.title">
        <app-work-schedule-form (scheduleChange)="onScheduleChange($event)" />
      </section>

      <section class="flex flex-col gap-5 lg:col-span-7" [attr.aria-label]="t().summary.title">
        <app-workday-status-notification [notification]="notification()" />
        <app-work-summary [result]="result()" />
      </section>

      <section class="lg:col-span-12" [attr.aria-label]="t().adjustment.title">
        <app-work-time-adjustment
          [schedule]="schedule()"
          [enabled]="canAdjust()"
          (applyAdjustment)="onApplyAdjustment($event)"
        />
      </section>
    </main>
  </div>
</div>
